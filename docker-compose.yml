services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-lesson-planner:latest
    container_name: ai-lesson-planner
    ports:
      - "3001:3001"
    # Runtime secrets — never baked into the image
    env_file:
      - .env.local          # used locally; swap for .env.production in CI/CD
    environment:
      NODE_ENV: production
      PORT: 3001
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
